# Builds the dashboard in demo mode and publishes it to GitHub Pages.
#
# The real app needs a Node server, a database, and credentials, none of which
# can run on Pages. VITE_DEMO=1 swaps the network layer for a local mock so the
# UI is explorable as a static site. Nothing in this build can reach a network.
name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Pages source is set to "GitHub Actions" in repo settings. Do not pass
      # enablement here: the default GITHUB_TOKEN lacks the admin scope needed
      # to turn Pages on, and that failure blocks the whole build.
      - uses: actions/configure-pages@v5
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build demo
        working-directory: web
        env:
          VITE_DEMO: '1'
        run: |
          npm run build
          # SPA fallback so deep links resolve on Pages
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
